<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alislamiah API Studio - Gemalot Normal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: #0f172a; color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .container { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 500px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { color: #38bdf8; margin-bottom: 20px; text-align: center; }
        .step { display: none; }
        .step.active { display: block; }
        label { display: block; margin-bottom: 8px; font-weight: 600; }
        input[type="text"] { width: 100%; padding: 12px; margin-bottom: 20px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; }
        button { width: 100%; padding: 12px; background: #0284c7; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background: #0369a1; }
        .result-box { background: #0f172a; padding: 15px; border-radius: 6px; border: 1px solid #334155; margin-bottom: 15px; word-break: break-all; font-family: monospace; font-size: 0.85rem; color: #38bdf8; }
    </style>
</head>
<body>

    <div class="container">
        <!-- الخطوة 1 -->
        <div id="step1" class="step active">
            <h2>إنشاء مشروع Gemalot Normal</h2>
            <label>Project Name:</label>
            <input type="text" id="projectName" placeholder="أدخل اسم المشروع">
            <button onclick="goToStep2()">Next</button>
        </div>

        <!-- الخطوة 2 -->
        <div id="step2" class="step">
            <h2>تسمية مفتاح API</h2>
            <label>Project ID:</label>
            <div class="result-box" id="displayProjectId"></div>
            <label>Name your API Key:</label>
            <input type="text" id="apiKeyName" placeholder="أدخل اسم المفتاح">
            <button onclick="generateUserKey()">توليد المفتاح العشوائي</button>
        </div>

        <!-- الخطوة 3 -->
        <div id="step3" class="step">
            <h2>تم إنشاء المفتاح (حد 100 رسالة)</h2>
            <label>مفتاحك العشوائي:</label>
            <div class="result-box" id="finalUserKey"></div>
            <label>كود التثبيت (Gemalot Normal):</label>
            <div class="result-box" id="installCode" style="font-size: 0.75rem; color: #cbd5e1;"></div>
            <button onclick="location.reload()">إنشاء مشروع جديد</button>
        </div>
    </div>

    <script>
        let projId = "";

        function goToStep2() {
            const name = document.getElementById('projectName').value.trim();
            if(!name) return alert('الرجاء إدخال اسم المشروع');
            const randNum = Math.floor(100000 + Math.random() * 900000);
            projId = `${name}-${randNum}`;
            document.getElementById('displayProjectId').innerText = projId;
            document.getElementById('step1').classList.remove('active');
            document.getElementById('step2').classList.add('active');
        }

        function generateUserKey() {
            const kName = document.getElementById('apiKeyName').value.trim();
            if(!kName) return alert('الرجاء تسمية المفتاح');

            // توليد مفتاح عشوائي للمستخدم
            const randStr = Math.random().toString(36).substring(2) + Math.random().toString(36).substring(2);
            const userKey = `AQ.${randStr.toUpperCase()}`;

            document.getElementById('finalUserKey').innerText = userKey;

            // كود الاستدعاء الموجه حصرياً لنموذج Gemalot Normal على الرابط المطلوب
            const code = `
// Alislamiah API - Gemalot Normal Model
const USER_API_KEY = "${userKey}";
const PROJECT_ID = "${projId}";
const GEMALOT_ENDPOINT = "https://Alislamiah.github.io/Gemalot/";

async function callGemalotNormal(promptText) {
    const response = await fetch(GEMALOT_ENDPOINT, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + USER_API_KEY,
            'X-Project-ID': PROJECT_ID,
            'X-Model': 'Gemalot-Normal'
        },
        body: JSON.stringify({ prompt: promptText })
    });
    return await response.json();
}
            `.trim();

            document.getElementById('installCode').innerText = code;
            document.getElementById('step2').classList.remove('active');
            document.getElementById('step3').classList.add('active');
        }
    </script>
</body>
</html>
